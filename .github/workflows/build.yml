name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['config.json']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Icones
        working-directory: client
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          for n in icon-only icon-foreground icon-background; do
            rsvg-convert -w 1024 -h 1024 icon/$n.svg -o assets/$n.png
          done
      - name: Build
        working-directory: client
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aziz-express
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
